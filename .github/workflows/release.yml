name: release
# As Frodhes' release.yml, for Textura. A version tag (textura-v0.2.5 ...) builds the FM-1 app in CI and publishes
# the GitHub release with its assets: textura-app-X.Y.Z.fwsc and textura-app-X.Y.Z.json (make fm1-app REL=X.Y.Z:
# VERSION X.Y.Z in the app; the json: version, commit, date, identity, USB name and id, sha256, changes). A full
# release (not a draft, not a prerelease), marked latest; the repository's visibility is not touched (a private
# repository's release stays private). The notes: docs/releases/<tag>.md when the tag has one (its first paragraph
# is the json's changes), else "Textura X.Y.Z". Every step is safe to rerun (a rerun replaces the assets).
# The emulator on GitHub Pages (prepared, off until the repository variable PAGES_ENABLED is 'true'; it is unset
# while the repository is private): the job web-dist builds it from the tag (web/build.sh --release X.Y.Z, through
# make fw-web-check REL=X.Y.Z: the page shows that version and passes its checks, the installer's selftest too) before
# anything is published, and a failure stops the release; the job release then creates the release as a draft, puts
# the package beside the emulator for its installer (tools/web_firmware.sh: textura.fwsc, firmware.json), deploys it
# to the gh-pages branch (tools/deploy_pages.sh: "Emulator X.Y.Z", the branch's other files kept; the branch is
# created, with .nojekyll, on the first deploy), waits until Pages has built that commit and serves every file byte
# for byte (tools/pages_wait.sh), and only then publishes the release. Before setting PAGES_ENABLED: Settings > Pages,
# source "Deploy from a branch", gh-pages / (root) (after the first deploy made the branch, or push an empty one).
# Without PAGES_ENABLED none of this runs and the release is published at once, as before. Only a textura-v* tag
# deploys: ci.yml builds and tests the emulator, never deploys it.
# Tag only what passed the tests on the FM-1.
on:
  push:
    tags: ['textura-v*']
permissions:
  contents: write                    # the release
  actions: read                      # ci-gate reads the ci runs
  pages: write                       # tools/pages_wait.sh reads the Pages builds (and asks for one if none started)
jobs:
  # ci.yml already runs every test (host, firmware, web) on each push to main. If ci passed on exactly this commit
  # (waiting up to 40 min if it is still running), or on a commit with the identical git tree, the release skips its
  # own copy of the tests; if ci failed, never ran or timed out, the fallback jobs below run them here, and a failure
  # stops the release before the build and publish (tools/ci_gate.sh, CI_GATE_JOBS).
  ci-gate:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_GATE_JOBS: host firmware web
        run: sh tools/ci_gate.sh "$GITHUB_SHA"
  host:                              # fallback only: every host test (ci.yml's host-tests, on the same arm64 runner)
    needs: ci-gate
    if: needs.ci-gate.outputs.passed != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: command -v clang || { sudo apt-get update && sudo apt-get install -y clang; }
      - name: host tests (fallback only, when ci did not pass on this commit)
        run: |
          sh tools/guard.sh
          make tx-test CC=clang && make tx-libcalls CC=clang && make tx-pristine CC=clang && make fw-test CC=clang
  web:                               # fallback only: the web panel built and checked (ci.yml's web)
    needs: ci-gate
    if: needs.ci-gate.outputs.passed != 'true'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.64.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/emsdk
          key: emsdk-${{ hashFiles('tools/get_emsdk.sh') }}-${{ runner.os }}-${{ runner.arch }}-playwright-image
      - run: apt-get update -qq && apt-get install -y -qq xz-utils make python3-venv
      - run: sh tools/get_emsdk.sh .local/emsdk
      - run: |
          python3 -m venv .local/venv
          .local/venv/bin/pip install -q playwright==1.64.0
          PLAYWRIGHT_BROWSERS_PATH=.local/playwright .local/venv/bin/python -m playwright install chromium
      - run: make fw-web-check LOCK=0
  web-dist:                          # PAGES_ENABLED only: the emulator from the tag, built and checked before anything is published
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.64.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/emsdk
          key: emsdk-${{ hashFiles('tools/get_emsdk.sh') }}-${{ runner.os }}-${{ runner.arch }}-playwright-image
      - run: apt-get update -qq && apt-get install -y -qq xz-utils make python3-venv
      - run: sh tools/get_emsdk.sh .local/emsdk
      - run: |
          python3 -m venv .local/venv
          .local/venv/bin/pip install -q playwright==1.64.0
          PLAYWRIGHT_BROWSERS_PATH=.local/playwright .local/venv/bin/python -m playwright install chromium
      - name: build the emulator with the tag's version and check it (the installer's selftest included)
        run: make fw-web-check LOCK=0 REL="${GITHUB_REF_NAME#textura-v}"
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: build/web
          if-no-files-found: error
  release:
    needs: [ci-gate, host, web, web-dist]
    # runs when ci passed on this commit (the fallback jobs skipped) or when both fallback jobs passed, and the
    # emulator passed its checks (or Pages is off: web-dist skipped). x86_64: the JieLi toolchain
    # (tools/get_toolchain.sh) runs on nothing else
    if: >-
      !cancelled() && needs.ci-gate.result == 'success' &&
      (needs.ci-gate.outputs.passed == 'true' || (needs.host.result == 'success' && needs.web.result == 'success')) &&
      (needs.web-dist.result == 'success' || (needs.web-dist.result == 'skipped' && vars.PAGES_ENABLED != 'true'))
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    env:
      PAGES: ${{ vars.PAGES_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/jieli
          key: jieli-${{ hashFiles('tools/get_toolchain.sh') }}-${{ runner.os }}-${{ runner.arch }}
      # the 3 SDK files are pinned by sha256 in get_sdk.sh: cached, so a slow or resetting gitee.com (curl 35 in CI,
      # 2026-11-17) no longer fails a run once they are in the cache
      - uses: actions/cache@v4
        with:
          path: .local/fw-AC79_AIoT_SDK
          key: ac79sdk-${{ hashFiles('tools/get_sdk.sh') }}
      - name: the JieLi toolchain and the 3 AC79 SDK files (checked by sha256)
        run: |
          [ -e .local/jieli/toolchain ] || sh tools/get_toolchain.sh .local/jieli
          sh tools/get_sdk.sh .local/fw-AC79_AIoT_SDK
      - name: build
        run: |
          V="${GITHUB_REF_NAME#textura-v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag $GITHUB_REF_NAME: use textura-vX.Y.Z" >&2; exit 1; }
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then make fm1-app REL="$V" NOTES="$NOTES"; else make fm1-app REL="$V"; fi
          ls -l "build/fm1/textura-app-$V.fwsc" "build/fm1/textura-app-$V.json"
          sha256sum "build/fm1/textura-app-$V.fwsc"
          cat "build/fm1/textura-app-$V.json"
      - name: publish the release (full, latest; a rerun replaces the assets; with Pages a draft until the emulator is live)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#textura-v}"
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || { echo "Textura $V" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          set -- "build/fm1/textura-app-$V.fwsc" "build/fm1/textura-app-$V.json"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$@" --clobber
            if [ "$PAGES" = true ]; then
              gh release edit "$GITHUB_REF_NAME" --title "Textura $V" --notes-file "$NOTES"
            else
              gh release edit "$GITHUB_REF_NAME" --title "Textura $V" --notes-file "$NOTES" --draft=false --prerelease=false --latest
            fi
          elif [ "$PAGES" = true ]; then
            gh release create "$GITHUB_REF_NAME" "$@" --title "Textura $V" --notes-file "$NOTES" --draft
          else
            gh release create "$GITHUB_REF_NAME" "$@" --title "Textura $V" --notes-file "$NOTES" --latest
          fi
      # ---- PAGES_ENABLED only: the emulator of this tag live before the release leaves draft (see the top)
      - name: the emulator built and checked by the job web-dist
        if: env.PAGES == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: build/web
      - name: the gh-pages branch in build/pages (created, with .nojekyll, if it does not exist yet)
        if: env.PAGES == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch -q --depth 1 origin gh-pages:gh-pages
            git worktree add build/pages gh-pages
          else
            git worktree add --detach build/pages
            git -C build/pages checkout -q --orphan gh-pages
            git -C build/pages rm -rqf .
            touch build/pages/.nojekyll
            git -C build/pages add .nojekyll
            git -C build/pages commit -q -m "gh-pages: the emulator's branch"
          fi
      - name: the package beside the emulator (its installer; release downloads have no CORS)
        if: env.PAGES == 'true'
        run: |
          V="${GITHUB_REF_NAME#textura-v}"
          sh tools/web_firmware.sh "build/fm1/textura-app-$V.fwsc" build/web "$V"
      - name: deploy the emulator
        if: env.PAGES == 'true'
        run: sh tools/deploy_pages.sh build/web build/pages "${GITHUB_REF_NAME#textura-v}"
      - name: wait for Pages
        if: env.PAGES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          sh tools/pages_wait.sh "$(git -C build/pages rev-parse HEAD)" build/web \
            "https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/"
      - name: publish the release
        if: env.PAGES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
